# Seeds (spec Seeds and Narrative Debt): after the minimum delay, a payoff chance each month (applied daily, D-040);
# defused if every defuse condition holds.
seeds:
  - { id: mara_protest,        weight: 20, min_delay_days: 30, monthly_chance: 0.3,  defuse: [ "province.kestria_east_ossen.dark == 0" ] }
  - { id: no_confidence,       weight: 25, min_delay_days: 30, monthly_chance: 0.3,  defuse: [ "faction.nationalists.approval >= 75" ] }
  - { id: emergency_never_ends, weight: 20, min_delay_days: 30, monthly_chance: 0.2, defuse: [ "emergency == 0" ] }
  - { id: allies_step_back,    weight: 20, min_delay_days: 30, monthly_chance: 0.3,  defuse: [] }
