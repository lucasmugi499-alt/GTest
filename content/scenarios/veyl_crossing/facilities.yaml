# Facilities (spec Data model: Facility; the fab mirrors the spec's Sample record).
#   capacity         units of the recipe per day (wafer starts for a fab)
#   efficiency       E, 0.1 to 1 (spec Efficiency and retooling)
#   dual_use         converted dual-use line: E_max 0.9 instead of 1.0
#   experience_days  fabs only: X, cumulative starts ÷ daily capacity (spec Fab yield)
#   power_mw         draw on its substation; 0 for none
#   kind             sets the default priority tier (balance.yaml: economy.priority)
#   labour           people required, by pool
#   damage           D, 0 to 1
# D-015: Tessera Fab 3 is 40% of national legacy capacity (1,200 of 3,000 starts, same efficiency and yield).

